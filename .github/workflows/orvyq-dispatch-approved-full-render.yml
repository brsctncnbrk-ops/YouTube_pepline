name: Dispatch ORVYQ Approved Full Render

on:
  pull_request:
    branches:
      - "agent/orvyq-render-base"
    paths:
      - ".github/orvyq-dispatch-trigger.txt"

permissions:
  actions: write
  contents: read

concurrency:
  group: orvyq-full-render-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch approved full render workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'render.yml',
              ref: 'agent/orvyq-full-render-approved',
              inputs: {
                project_id: '001-the-ai-race-no-one-can-afford-to-win',
                quality_control_approved: 'true',
                approved_preview_run_id: '29655003486'
              }
            });
            core.notice('ORVYQ full render dispatch accepted for agent/orvyq-full-render-approved');
