name: Approve ORVYQ Canonical Proof

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project id under projects/"
        required: true
        type: string
      proof_run_id:
        description: "Successful ORVYQ Canonical Proof workflow run id"
        required: true
        type: string
      human_score:
        description: "Human editorial score from 0 to 100"
        required: true
        type: number
      render_source_sha:
        description: "Source commit SHA recorded in the proof artifact"
        required: true
        type: string
      review_notes:
        description: "Short human review note"
        required: false
        default: "Approved after rendered-video review"
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: orvyq-proof-approval-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      PROOF_RUN_ID: ${{ inputs.proof_run_id }}
      HUMAN_SCORE: ${{ inputs.human_score }}
      RENDER_SOURCE_SHA: ${{ inputs.render_source_sha }}
      REVIEW_NOTES: ${{ inputs.review_notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout approval target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify proof workflow run and source commit
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROOF_RUN_ID}")"
          test "$(jq -r '.conclusion' <<<"$RUN_JSON")" = "success"
          test "$(jq -r '.name' <<<"$RUN_JSON")" = "ORVYQ Canonical Proof"
          test "$(jq -r '.head_sha' <<<"$RUN_JSON")" = "$RENDER_SOURCE_SHA"
          test "$(jq -r '.head_branch' <<<"$RUN_JSON")" = "$GITHUB_REF_NAME"

      - name: Validate unchanged plan and record hash-bound human approval
        run: |
          set -euo pipefail
          node scripts/orvyq_production_plan.mjs validate --project-id "$PROJECT_ID" --skip-assets
          node scripts/manifest_cli.mjs approve-proof \
            --project-id "$PROJECT_ID" \
            --proof-run-id "$PROOF_RUN_ID" \
            --human-score "$HUMAN_SCORE" \
            --render-source-sha "$RENDER_SOURCE_SHA" \
            --review-notes "$REVIEW_NOTES"
          node scripts/orvyq_production_plan.mjs check-approval --project-id "$PROJECT_ID"

      - name: Commit proof approval
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "projects/$PROJECT_ID/qa/proof_approval.json" \
            "projects/$PROJECT_ID/manifest.json"
          git diff --cached --quiet && { echo "Approval already recorded"; exit 0; }
          git commit -m "Approve ORVYQ proof for $PROJECT_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
