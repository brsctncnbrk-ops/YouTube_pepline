name: Inspect ORVYQ Render Failure

on:
  pull_request:
    branches:
      - "agent/orvyq-log-base"
    paths:
      - ".github/orvyq-log-trigger.txt"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest FactForge Render job log
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api --method GET "repos/$GH_REPO/actions/workflows/render.yml/runs" \
            -f branch='agent/orvyq-full-render-approved' \
            -f event='workflow_dispatch' \
            -f per_page=10 \
            --jq '.workflow_runs[0].id')"
          test -n "$RUN_ID"
          JOB_ID="$(gh api --method GET "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "render") | .id' | head -n 1)"
          test -n "$JOB_ID"
          echo "RUN_ID=$RUN_ID"
          echo "JOB_ID=$JOB_ID"
          gh api "repos/$GH_REPO/actions/jobs/$JOB_ID/logs" > render-job.log
          echo '--- LAST 240 LINES ---'
          tail -n 240 render-job.log
          echo '--- FAILURE MARKERS ---'
          grep -Ein 'error|failed|failure|traceback|assert|mismatch|missing|required|exit code|not found' render-job.log | tail -n 100 || true

      - name: Upload raw render job log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-render-job-log-${{ github.run_id }}
          path: render-job.log
          if-no-files-found: error
          retention-days: 3
