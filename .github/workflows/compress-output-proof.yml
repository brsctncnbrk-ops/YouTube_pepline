name: FactForge Compress Output Proof

on:
  push:
    branches:
      - agent/compress-output-proof-run-3
  pull_request:
    branches:
      - agent/render-output-proof-base

permissions:
  contents: read
  actions: read

concurrency:
  group: compress-output-proof-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "29443571268"
      SOURCE_ARTIFACT: factforge-output-proof-29443571268
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Download full render artifact
        run: |
          set -euo pipefail
          mkdir -p input output
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir input
          test -s input/final_video.mp4
          ffprobe -hide_banner -v error -show_format -show_streams input/final_video.mp4 > output/source-info.txt
          ls -lh input/final_video.mp4

      - name: Compress to downloadable 720p MP4
        run: |
          set -o pipefail
          ffmpeg -nostdin -hide_banner -y \
            -i input/final_video.mp4 \
            -map 0:v:0 -map 0:a:0? \
            -vf "scale=1280:-2:flags=lanczos" \
            -c:v libx264 -preset veryfast -crf 30 \
            -pix_fmt yuv420p \
            -c:a aac -b:a 96k -ac 2 \
            -movflags +faststart \
            output/factforge-render-proof-720p.mp4 \
            2>&1 | tee output/ffmpeg-compress.log
          test -s output/factforge-render-proof-720p.mp4
          ls -lh output/factforge-render-proof-720p.mp4

      - name: Upload compressed video
        uses: actions/upload-artifact@v4
        with:
          name: factforge-render-proof-720p-${{ github.run_id }}
          path: output/factforge-render-proof-720p.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload compression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factforge-render-proof-compression-diagnostics-${{ github.run_id }}
          path: |
            output/source-info.txt
            output/ffmpeg-compress.log
          if-no-files-found: warn
          retention-days: 30
