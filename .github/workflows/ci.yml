name: FactForge CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: factforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run pipeline smoke checks
        run: npm run ci:smoke

      - name: Validate migrated ORVYQ canonical plan
        run: node scripts/orvyq_production_plan.mjs validate --project-id 001-the-ai-race-no-one-can-afford-to-win --skip-assets

      - name: Check Node script syntax
        run: find scripts -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Test canonical production-plan and proof hash gates
        run: npm run orvyq:production-plan:test

      - name: Install deterministic Remotion dependencies
        working-directory: templates/remotion
        run: npm ci --no-audit --no-fund

      - name: Type-check Remotion template
        working-directory: templates/remotion
        run: npx tsc --noEmit
