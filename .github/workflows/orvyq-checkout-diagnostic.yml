name: ORVYQ Source Mix Diagnostic

on:
  push:
    branches:
      - agent/orvyq-system-wide-production
    paths:
      - .github/orvyq-checkout-diagnostic-trigger.txt

permissions:
  actions: read
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN_ID: "29749369463"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Extract source-mix enforcement failure
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/logs" > logs.zip; then break; fi
            sleep $((attempt * 4))
          done
          test -s logs.zip
          mkdir -p logs
          unzip -q logs.zip -d logs
          TARGET="$(find logs -type f -name '*Normalize, rebalance, enforce source mix, and bind evidence bundle.txt' -print -quit)"
          test -n "$TARGET"
          {
            echo "RUN_ID=$TARGET_RUN_ID"
            echo "TARGET=$TARGET"
            grep -nE 'Error:|failed|needs [0-9]+ frames|headroom|eligible contextual|unknown evidence|Official capture target|Evidence/source-derived target|graphic fraction|evidence run|##\[error\]|Process completed with exit code|"ok"[[:space:]]*:[[:space:]]*false' "$TARGET" || true
            echo '--- LAST 220 LINES ---'
            tail -n 220 "$TARGET"
          } > .github/orvyq-checkout-diagnostic.txt
          cat .github/orvyq-checkout-diagnostic.txt
      - name: Commit diagnostic
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/orvyq-checkout-diagnostic.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Capture latest ORVYQ source-mix enforcement failure'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 3))
          done
          exit 1
