name: FactForge Render

# Fallback render path. The primary path is scripts/render_vps.sh, run on
# the dedicated render VPS (see docs/VPS_RENDER.md) - never on an author's
# own machine. This workflow stays wired up as a backup for when the VPS is
# unavailable. Triggered explicitly (not on push) so a render only runs once
# the render QA gate has confirmed the project is READY_FOR_RENDER - a
# push-based trigger could fire on any incremental asset commit before that.
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project id under projects/ (e.g. 001-my-video)"
        required: true
        type: string

permissions:
  contents: write

# One render at a time per project; a newer dispatch cancels an in-flight one.
concurrency:
  group: render-${{ inputs.project_id }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS assets)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS assets
        run: git lfs pull

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install root tooling deps
        run: npm ci

      - name: Render-readiness hard gate
        # Defense in depth: re-run the same check the render QA gate ran, so a
        # workflow dispatched out of band can't burn render minutes on a
        # project that isn't actually ready. validate.mjs exits non-zero on fail.
        run: node scripts/validate.mjs render-ready --project-id "${{ inputs.project_id }}"

      - name: Install Remotion project deps
        working-directory: projects/${{ inputs.project_id }}/remotion/render_ready_project
        run: npm install --no-audit --no-fund

      - name: Render video
        working-directory: projects/${{ inputs.project_id }}/remotion/render_ready_project
        run: |
          set -euo pipefail
          mkdir -p out
          npx remotion render src/index.ts FactForgeVideo out/final_video.mp4 --codec=h264 2>&1 | tee out/render_stdout.txt

      - name: Collect output
        run: |
          set -euo pipefail
          PID="${{ inputs.project_id }}"
          SRC="projects/$PID/remotion/render_ready_project/out"
          DEST="projects/$PID/output"
          mkdir -p "$DEST"
          cp "$SRC/final_video.mp4" "$DEST/final_video.mp4"
          {
            echo "Rendered at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Workflow run: ${{ github.run_id }}"
            echo "---"
            tail -n 40 "$SRC/render_stdout.txt" || true
          } > "$DEST/render_log.txt"

      - name: Mark manifest RENDER_DONE
        run: node scripts/manifest_cli.mjs render-complete --project-id "${{ inputs.project_id }}" --output-file "output/final_video.mp4"

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: final_video-${{ inputs.project_id }}
          path: projects/${{ inputs.project_id }}/output/final_video.mp4
          if-no-files-found: error

      - name: Commit rendered output back to the branch
        run: |
          set -euo pipefail
          PID="${{ inputs.project_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "projects/$PID/output/final_video.mp4" "projects/$PID/output/render_log.txt" "projects/$PID/manifest.json" "projects/$PID/assets/asset_manifest.json"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Render $PID: final_video.mp4 (run ${{ github.run_id }})"
            git push origin HEAD:${{ github.ref_name }}
          fi
