name: FactForge Render

# Full-duration renders are manual. For ORVYQ projects, the workflow trusts only
# the committed, hash-bound human proof approval. UI checkboxes are retained as
# deprecated compatibility inputs but cannot bypass the canonical plan gate.
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project id under projects/ (e.g. 001-my-video)"
        required: true
        type: string
      quality_control_approved:
        description: "Deprecated compatibility input; qa/proof_approval.json is authoritative"
        required: false
        default: false
        type: boolean
      approved_preview_run_id:
        description: "Deprecated compatibility input; the approved run id is read from qa/proof_approval.json"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: render-${{ inputs.project_id }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ inputs.project_id }}
    steps:
      - name: Checkout exact source with LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Lock exact source commit
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$GITHUB_SHA"
          printf '%s\n' "$ACTUAL_SHA" | tee render-source-sha.txt

      - name: Pull LFS assets
        run: git lfs pull

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils
          python -m pip install --disable-pip-version-check faster-whisper==1.2.0 requests==2.32.5

      - name: Validate project id
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import {assertValidProjectId} from "./scripts/lib/fs-utils.mjs";
            assertValidProjectId(process.env.PROJECT_ID);
            console.log(`Validated project id: ${process.env.PROJECT_ID}`);
          '

      - name: Resolve and verify canonical narration timeline
        run: |
          set -euo pipefail
          python scripts/orvyq_narration_timeline.py --project-id "$PROJECT_ID"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const dir = `projects/${process.env.PROJECT_ID}`;
          const plan = JSON.parse(fs.readFileSync(`${dir}/direction/production_plan.json`, 'utf8'));
          const timelineRaw = fs.readFileSync(`${dir}/direction/narration_timeline.json`, 'utf8');
          const timeline = JSON.parse(timelineRaw);
          const actual = crypto.createHash('sha256').update(timelineRaw).digest('hex');
          const expected = plan.quality_policy?.narration_timeline_sha256;
          if (!expected || actual !== expected) throw new Error(`Narration timeline drift: ${actual} != ${expected || 'missing'}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `ORVYQ_NARRATION_LIMIT_SECONDS=${timeline.source_duration_seconds}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `ORVYQ_AUDIO_LIMIT_SECONDS=${timeline.full_output_duration_seconds}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, 'ORVYQ_EDITORIAL_PAUSES=1\n');
          NODE

      - name: Canonical full-production and proof-approval hard gate
        run: |
          set -euo pipefail
          node scripts/orvyq_production_plan.mjs validate --project-id "$PROJECT_ID" --skip-assets
          node scripts/orvyq_production_plan.mjs check-approval --project-id "$PROJECT_ID"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {productionPlanSha256} from './scripts/lib/orvyq-production.mjs';
          const plan = JSON.parse(fs.readFileSync(`projects/${process.env.PROJECT_ID}/direction/production_plan.json`, 'utf8'));
          fs.writeFileSync('production-plan-sha256.txt', `${productionPlanSha256(plan)}\n`);
          NODE

      - name: Fetch and verify official primary evidence
        run: |
          set -euo pipefail
          node scripts/orvyq_fetch_primary_evidence.mjs
          node scripts/orvyq_production_plan.mjs validate --project-id "$PROJECT_ID"

      - name: Fetch licensed music and build full-duration voice-first mix
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {fetchProofMusic} from './scripts/orvyq_fetch_proof_music.mjs';
          import {buildOrvyqAudioMix} from './scripts/orvyq_audio_mix.mjs';
          await fetchProofMusic(process.env.PROJECT_ID);
          const result = await buildOrvyqAudioMix(process.env.PROJECT_ID);
          console.log(JSON.stringify({ok: true, ...result}));
          NODE

      - name: Verify narration and build captions
        run: |
          set -euo pipefail
          python scripts/orvyq_speech_qa.py --project-id "$PROJECT_ID"
          node --input-type=module <<'NODE'
          import {buildOrvyqCaptions} from './scripts/orvyq_caption_build.mjs';
          const result = await buildOrvyqCaptions(process.env.PROJECT_ID);
          console.log(JSON.stringify({ok: true, caption_count: result.captions?.length || 0}));
          NODE

      - name: Compile full edit from the approved canonical plan
        run: |
          set -euo pipefail
          node scripts/orvyq_production_plan.mjs build-full --project-id "$PROJECT_ID"

      - name: Editorial provenance timeline and render-readiness gates
        run: |
          set -euo pipefail
          node scripts/orvyq_production_plan.mjs validate --project-id "$PROJECT_ID"
          node scripts/orvyq_production_plan.mjs check-approval --project-id "$PROJECT_ID"
          if [ "$PROJECT_ID" = "001-the-ai-race-no-one-can-afford-to-win" ]; then
            node scripts/orvyq_timeline_audit.mjs "$PROJECT_ID"
            node scripts/orvyq_edit_plan_tests.mjs
            node scripts/orvyq_license_audit.mjs
          fi
          node scripts/validate.mjs render-ready --project-id "$PROJECT_ID"

      - name: Rebuild render-ready Remotion project
        run: |
          set -euo pipefail
          node scripts/remotion_build.mjs derive-configs --project-id "$PROJECT_ID"
          node scripts/remotion_build.mjs build-project --project-id "$PROJECT_ID"

      - name: Install deterministic Remotion dependencies and type-check
        run: |
          set -euo pipefail
          cd "projects/$PROJECT_ID/remotion/render_ready_project"
          npm ci --no-audit --no-fund
          npx tsc --noEmit

      - name: Resolve browser executable
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$BROWSER"
          echo "FACTFORGE_REMOTION_BROWSER_EXECUTABLE=$BROWSER" >> "$GITHUB_ENV"
          "$BROWSER" --version

      - name: Render full video
        run: |
          set -euo pipefail
          APP="projects/$PROJECT_ID/remotion/render_ready_project"
          mkdir -p "$APP/out"
          cd "$APP"
          npx remotion render src/index.ts FactForgeVideo out/final_video.mp4 --codec=h264 --concurrency=1 2>&1 | tee out/render_stdout.txt

      - name: Post-render media speech and complete-ending gates
        run: |
          set -euo pipefail
          APP="projects/$PROJECT_ID/remotion/render_ready_project"
          node scripts/orvyq_media_qa.mjs --project-id "$PROJECT_ID" --video "$APP/out/final_video.mp4"
          python scripts/orvyq_speech_qa.py --project-id "$PROJECT_ID" --media "$APP/out/final_video.mp4" --output-name final_video_speech_qa.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const qa = JSON.parse(fs.readFileSync(`projects/${process.env.PROJECT_ID}/qa/final_video_speech_qa.json`, 'utf8'));
          const token = qa.words?.at(-1)?.text || qa.transcript?.trim().split(/\s+/).at(-1) || '';
          if (!/[.!?…]["')\]]*$/.test(token) || /-$/.test(token)) throw new Error(`Full render narration ends incompletely: ${token || '<empty>'}`);
          NODE

      - name: Collect successful render output
        run: |
          set -euo pipefail
          SRC="projects/$PROJECT_ID/remotion/render_ready_project/out"
          DEST="projects/$PROJECT_ID/output"
          mkdir -p "$DEST"
          cp "$SRC/final_video.mp4" "$DEST/final_video.mp4"
          APPROVED_RUN="$(node --input-type=module -e "import fs from 'node:fs'; const a=JSON.parse(fs.readFileSync('projects/$PROJECT_ID/qa/proof_approval.json')); process.stdout.write(String(a.proof_run_id));")"
          {
            echo "Rendered at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Workflow run: ${{ github.run_id }}"
            echo "Approved proof run: $APPROVED_RUN"
            echo "Source commit: ${{ github.sha }}"
            echo "Production plan SHA-256: $(cat production-plan-sha256.txt)"
            echo "---"
            tail -n 80 "$SRC/render_stdout.txt" || true
          } > "$DEST/render_log.txt"
          node scripts/manifest_cli.mjs render-complete --project-id "$PROJECT_ID" --output-file "output/final_video.mp4"

      - name: Upload render bundle
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-render-${{ env.PROJECT_ID }}-${{ github.run_id }}
          path: |
            render-source-sha.txt
            production-plan-sha256.txt
            projects/${{ env.PROJECT_ID }}/output/final_video.mp4
            projects/${{ env.PROJECT_ID }}/output/render_log.txt
            projects/${{ env.PROJECT_ID }}/manifest.json
            projects/${{ env.PROJECT_ID }}/direction/production_plan.json
            projects/${{ env.PROJECT_ID }}/direction/narration_timeline.json
            projects/${{ env.PROJECT_ID }}/direction/edit_plan.json
            projects/${{ env.PROJECT_ID }}/qa/proof_approval.json
            projects/${{ env.PROJECT_ID }}/qa/production_plan_audit.json
            projects/${{ env.PROJECT_ID }}/qa/timeline_audit.json
            projects/${{ env.PROJECT_ID }}/qa/orvyq_media_qa.json
            projects/${{ env.PROJECT_ID }}/qa/final_video_speech_qa.json
            projects/${{ env.PROJECT_ID }}/assets/audio/final_mix.metadata.json
            projects/${{ env.PROJECT_ID }}/assets/asset_manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload render diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-render-diagnostics-${{ env.PROJECT_ID }}-${{ github.run_id }}
          path: |
            render-source-sha.txt
            production-plan-sha256.txt
            projects/${{ env.PROJECT_ID }}/remotion/render_ready_project/out/render_stdout.txt
            projects/${{ env.PROJECT_ID }}/output/render_log.txt
            projects/${{ env.PROJECT_ID }}/qa/production_plan_audit.json
            projects/${{ env.PROJECT_ID }}/qa/timeline_audit.json
          if-no-files-found: warn
          retention-days: 30
