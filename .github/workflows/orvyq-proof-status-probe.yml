name: ORVYQ Proof Status Probe

on:
  pull_request:
    paths:
      - .github/orvyq-proof-status-probe.txt
      - .github/workflows/orvyq-proof-status-probe.yml

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Query latest full-plan and render workflows
        run: |
          set -euo pipefail
          REBALANCE="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/workflows/orvyq-full-plan-rebalance.yml/runs?branch=agent%2Forvyq-system-wide-production&per_page=5")"
          RENDER="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/workflows/render.yml/runs?branch=agent%2Forvyq-system-wide-production&per_page=5")"
          echo '--- REBALANCE RUNS ---'
          echo "$REBALANCE" | jq '[.workflow_runs[] | {id,event,status,conclusion,head_sha,created_at,updated_at,html_url}]'
          echo '--- RENDER RUNS ---'
          echo "$RENDER" | jq '[.workflow_runs[] | {id,event,status,conclusion,head_sha,created_at,updated_at,html_url}]'
          echo "LATEST_REBALANCE_RUN_ID=$(echo "$REBALANCE" | jq -r '.workflow_runs[0].id // empty')"
          echo "LATEST_RENDER_RUN_ID=$(echo "$RENDER" | jq -r '.workflow_runs[0].id // empty')"

      - name: Show active or latest rebalance job steps
        run: |
          set -euo pipefail
          RUN_ID="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/workflows/orvyq-full-plan-rebalance.yml/runs?branch=agent%2Forvyq-system-wide-production&per_page=1" --jq '.workflow_runs[0].id')"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" | jq '{run_id:'"$RUN_ID"',jobs:[.jobs[]|{id,name,status,conclusion,steps:[.steps[]|{number,name,status,conclusion}]}]}'
