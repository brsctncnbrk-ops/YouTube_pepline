name: ORVYQ Proof Status Probe

on:
  pull_request:
    paths:
      - .github/orvyq-proof-status-probe.txt
      - .github/workflows/orvyq-proof-status-probe.yml

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Query canonical proof workflow runs
        run: |
          set -euo pipefail
          RUNS_JSON="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/workflows/orvyq-proof.yml/runs?branch=agent%2Forvyq-system-wide-production&per_page=10")"
          echo "$RUNS_JSON" | jq '{total_count, runs: [.workflow_runs[] | {id, name, event, status, conclusion, head_sha, run_number, created_at, updated_at, html_url}]}'
          LATEST_ID="$(echo "$RUNS_JSON" | jq -r '.workflow_runs[0].id // empty')"
          test -n "$LATEST_ID"
          echo "LATEST_PROOF_RUN_ID=$LATEST_ID"

      - name: Extract latest proof failure
        run: |
          set -euo pipefail
          RUN_ID="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/workflows/orvyq-proof.yml/runs?branch=agent%2Forvyq-system-wide-production&per_page=1" --jq '.workflow_runs[0].id')"
          mkdir -p proof-logs
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/logs" > proof-logs.zip
          unzip -q proof-logs.zip -d proof-logs
          echo "--- FILTERED FAILURE LINES ---"
          grep -RniE -C 6 'error|failed|failure|music|approved|license|licence|403|404|exit code' proof-logs || true
