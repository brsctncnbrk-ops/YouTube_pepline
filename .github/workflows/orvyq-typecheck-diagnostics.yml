name: ORVYQ TypeScript Diagnostics

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "claude/factforge-system-design-0pr3v3"

permissions:
  contents: read

concurrency:
  group: orvyq-typescript-diagnostics
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          cd templates/remotion
          npm ci --no-audit --no-fund
      - name: Capture exact TypeScript diagnostics
        run: |
          set +e
          cd templates/remotion
          npx tsc --noEmit > "$GITHUB_WORKSPACE/orvyq-typescript.log" 2>&1
          status=$?
          echo "$status" > "$GITHUB_WORKSPACE/orvyq-typescript.status"
          cat "$GITHUB_WORKSPACE/orvyq-typescript.log"
          exit 0
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-typescript-${{ github.run_id }}
          path: |
            orvyq-typescript.log
            orvyq-typescript.status
          retention-days: 3
      - name: Stop on TypeScript failure
        run: test "$(cat orvyq-typescript.status)" = "0"
