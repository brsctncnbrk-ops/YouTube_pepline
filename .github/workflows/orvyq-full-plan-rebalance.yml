name: ORVYQ Full Plan Rebalance

on:
  push:
    branches:
      - agent/orvyq-system-wide-production
    paths:
      - .github/orvyq-full-plan-rebalance-trigger.txt

permissions:
  contents: write
  actions: write

concurrency:
  group: orvyq-full-plan-rebalance
  cancel-in-progress: false

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PROJECT_ID: 001-the-ai-race-no-one-can-afford-to-win
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout branch without LFS smudge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull and verify LFS assets with retries
        run: |
          set -euo pipefail
          git lfs install --local
          success=0
          for attempt in 1 2 3 4; do
            if GIT_LFS_SKIP_SMUDGE=1 git lfs pull; then
              success=1
              break
            fi
            git lfs logs last || true
            sleep $((attempt * 5))
          done
          test "$success" = "1"
          git lfs fsck

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deterministic tooling
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils
          python -m pip install --disable-pip-version-check faster-whisper==1.2.0 requests==2.32.5
          BROWSER="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$BROWSER"
          "$BROWSER" --version

      - name: Resolve canonical full-audio limits
        run: |
          set -euo pipefail
          python scripts/orvyq_narration_timeline.py --project-id "$PROJECT_ID"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const dir = `projects/${process.env.PROJECT_ID}`;
          const plan = JSON.parse(fs.readFileSync(`${dir}/direction/production_plan.json`, 'utf8'));
          const timelineRaw = fs.readFileSync(`${dir}/direction/narration_timeline.json`, 'utf8');
          const timeline = JSON.parse(timelineRaw);
          const actual = crypto.createHash('sha256').update(timelineRaw).digest('hex');
          const expected = plan.quality_policy?.narration_timeline_sha256;
          if (!expected || actual !== expected) throw new Error(`Narration timeline drift: ${actual} != ${expected || 'missing'}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `ORVYQ_NARRATION_LIMIT_SECONDS=${timeline.source_duration_seconds}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `ORVYQ_AUDIO_LIMIT_SECONDS=${timeline.full_output_duration_seconds}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, 'ORVYQ_EDITORIAL_PAUSES=1\n');
          NODE

      - name: Verify proof approval continuity regression contract
        run: |
          set -euo pipefail
          node scripts/orvyq_proof_approval_continuity_tests.mjs "$PROJECT_ID"

      - name: Expand and fetch available full-film official evidence
        run: |
          set -euo pipefail
          node scripts/orvyq_expand_primary_evidence_manifest.mjs "$PROJECT_ID"
          node scripts/orvyq_fetch_primary_evidence.mjs
          node scripts/orvyq_prune_unavailable_optional_captures.mjs "$PROJECT_ID"

      - name: Rebalance post-proof timeline and bind deterministic evidence bundle
        run: |
          set -euo pipefail
          node scripts/orvyq_rebalance_full_plan.mjs "$PROJECT_ID"
          node scripts/orvyq_normalize_official_legibility.mjs "$PROJECT_ID"
          node scripts/orvyq_production_plan.mjs validate --project-id "$PROJECT_ID"
          node scripts/orvyq_bind_full_render_evidence_bundle.mjs "$PROJECT_ID"
          test "$(jq -r '.pass' "projects/$PROJECT_ID/qa/full_render_evidence_bundle.json")" = "true"

      - name: Preserve existing proof approval by prefix continuity
        run: |
          set -euo pipefail
          node scripts/orvyq_refresh_approval_for_unchanged_prefix.mjs "$PROJECT_ID"
          node scripts/orvyq_production_plan.mjs check-approval --project-id "$PROJECT_ID"
          PROOF_RUN_ID="$(jq -r '.proof_run_id' "projects/$PROJECT_ID/qa/proof_approval.json")"
          test "$PROOF_RUN_ID" = "29701621699"
          test "$(jq -r '.new_proof_required' "projects/$PROJECT_ID/qa/proof_approval_continuity.json")" = "false"
          test "$(jq -r '.manifest_synchronized' "projects/$PROJECT_ID/qa/proof_approval_continuity.json")" = "true"
          echo "PROOF_RUN_ID=$PROOF_RUN_ID" >> "$GITHUB_ENV"

      - name: Build canonical full-duration audio and captions
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {fetchProofMusic} from './scripts/orvyq_fetch_proof_music.mjs';
          import {buildOrvyqAudioMix} from './scripts/orvyq_audio_mix.mjs';
          await fetchProofMusic(process.env.PROJECT_ID);
          const result = await buildOrvyqAudioMix(process.env.PROJECT_ID);
          console.log(JSON.stringify({ok: true, ...result}));
          NODE
          python scripts/orvyq_speech_qa.py --project-id "$PROJECT_ID"
          node --input-type=module <<'NODE'
          import {buildOrvyqCaptions} from './scripts/orvyq_caption_build.mjs';
          const result = await buildOrvyqCaptions(process.env.PROJECT_ID);
          console.log(JSON.stringify({ok: true, caption_count: result.captions?.length || 0}));
          NODE
          test -s "projects/$PROJECT_ID/assets/audio/final_mix.metadata.json"
          test -s "projects/$PROJECT_ID/remotion/captions.json"

      - name: Build approved full edit and run all gates
        run: |
          set -euo pipefail
          node scripts/orvyq_production_plan.mjs build-full --project-id "$PROJECT_ID"
          node scripts/orvyq_timeline_audit.mjs "$PROJECT_ID"
          node scripts/orvyq_evidence_audit.mjs
          node scripts/orvyq_evidence_asset_audit.mjs
          node scripts/orvyq_semantic_visual_audit.mjs
          node scripts/orvyq_pacing_audit.mjs
          node scripts/orvyq_official_legibility_gate.mjs "$PROJECT_ID"
          node scripts/orvyq_mobile_legibility_audit.mjs
          node scripts/orvyq_license_audit.mjs
          node scripts/orvyq_edit_plan_tests.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir = `projects/${process.env.PROJECT_ID}`;
          const report = JSON.parse(fs.readFileSync(`${dir}/qa/full_film_rebalance.json`, 'utf8'));
          const continuity = JSON.parse(fs.readFileSync(`${dir}/qa/proof_approval_continuity.json`, 'utf8'));
          const semantic = JSON.parse(fs.readFileSync(`${dir}/qa/semantic_visual_audit.json`, 'utf8'));
          const approval = JSON.parse(fs.readFileSync(`${dir}/qa/proof_approval.json`, 'utf8'));
          const manifest = JSON.parse(fs.readFileSync(`${dir}/manifest.json`, 'utf8'));
          const bundle = JSON.parse(fs.readFileSync(`${dir}/qa/full_render_evidence_bundle.json`, 'utf8'));
          if (!report.pass || !continuity.pass || !semantic.pass || !bundle.pass) throw new Error('Full-film structural correction did not pass');
          if (!continuity.prefix_unchanged || !continuity.narration_unchanged || continuity.new_proof_required) throw new Error('Existing proof approval cannot be preserved');
          if (semantic.official_primary_capture_fraction < 0.3) throw new Error('Official capture ratio remains below 30%');
          if (semantic.maximum_uninterrupted_evidence_seconds > 16) throw new Error('Evidence run remains above 16 seconds');
          if (manifest.proof?.production_plan_sha256 !== approval.production_plan_sha256) throw new Error('Manifest and proof approval plan hashes differ');
          console.log(JSON.stringify({ok:true, proof_run_id:continuity.proof_run_id, approval_preserved:continuity.approval_preserved, bundled_asset_count:bundle.bundled_asset_count, proof_prefix_sha256:continuity.current_prefix_sha256, official_capture_fraction:semantic.official_primary_capture_fraction, maximum_uninterrupted_evidence_seconds:semantic.maximum_uninterrupted_evidence_seconds, converted_official_count:report.converted_official_count, converted_breaker_count:report.converted_breaker_count}));
          NODE

      - name: Commit corrected plan, preserved approval, and evidence bundle
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BUNDLE="projects/$PROJECT_ID/qa/full_render_evidence_bundle.json"
          mapfile -t BUNDLED_ASSETS < <(jq -r '.local_assets[]' "$BUNDLE")
          git add \
            "projects/$PROJECT_ID/research/primary_evidence_manifest.json" \
            "projects/$PROJECT_ID/assets/evidence/primary_evidence.runtime.json" \
            "projects/$PROJECT_ID/direction/production_plan.json" \
            "projects/$PROJECT_ID/qa/optional_capture_availability.json" \
            "projects/$PROJECT_ID/qa/full_render_evidence_bundle.json" \
            "projects/$PROJECT_ID/qa/official_legibility_normalization.json" \
            "projects/$PROJECT_ID/qa/proof_approval.json" \
            "projects/$PROJECT_ID/qa/proof_approval_continuity.json" \
            "projects/$PROJECT_ID/qa/full_film_rebalance.json" \
            "projects/$PROJECT_ID/manifest.json" \
            "${BUNDLED_ASSETS[@]}"
          git diff --cached --quiet && { echo 'No structural full-film changes to commit'; exit 1; }
          git commit -m "Preserve approved proof and bundle ORVYQ full-render evidence"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "APPROVED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify preserved approval and bundled evidence after commit
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          success=0
          for attempt in 1 2 3 4; do
            if GIT_LFS_SKIP_SMUDGE=1 git lfs pull; then success=1; break; fi
            git lfs logs last || true
            sleep $((attempt * 5))
          done
          test "$success" = "1"
          git lfs fsck
          node scripts/orvyq_verify_bundled_evidence.mjs "$PROJECT_ID"
          node scripts/orvyq_production_plan.mjs check-approval --project-id "$PROJECT_ID"
          node scripts/orvyq_official_legibility_gate.mjs "$PROJECT_ID"
          test "$(jq -r '.proof_run_id' "projects/$PROJECT_ID/qa/proof_approval.json")" = "$PROOF_RUN_ID"
          test "$(jq -r '.prefix_unchanged' "projects/$PROJECT_ID/qa/proof_approval_continuity.json")" = "true"
          test "$(jq -r '.proof.production_plan_sha256' "projects/$PROJECT_ID/manifest.json")" = "$(jq -r '.production_plan_sha256' "projects/$PROJECT_ID/qa/proof_approval.json")"

      - name: Dispatch corrected full render directly
        run: |
          set -euo pipefail
          gh workflow run render.yml \
            --ref "$GITHUB_REF_NAME" \
            -f project_id="$PROJECT_ID" \
            -f quality_control_approved=true \
            -f approved_preview_run_id="$PROOF_RUN_ID"
          for attempt in $(seq 1 40); do
            RUNS="$(gh run list --workflow render.yml --branch "$GITHUB_REF_NAME" --event workflow_dispatch --limit 10 --json databaseId,status,conclusion,headSha,createdAt,url)"
            FULL_RENDER_RUN_ID="$(jq -r --arg sha "$APPROVED_SHA" '[.[] | select(.headSha==$sha)][0].databaseId // empty' <<<"$RUNS")"
            if [ -n "$FULL_RENDER_RUN_ID" ]; then
              echo "FULL_RENDER_RUN_ID=$FULL_RENDER_RUN_ID" >> "$GITHUB_ENV"
              break
            fi
            sleep 5
          done
          test -n "${FULL_RENDER_RUN_ID:-}"
          jq -n --arg proof_run_id "$PROOF_RUN_ID" --arg full_render_run_id "$FULL_RENDER_RUN_ID" --arg source_sha "$APPROVED_SHA" '{proof_run_id:$proof_run_id,full_render_run_id:$full_render_run_id,source_sha:$source_sha,status:"dispatched",new_proof_run:false}' | tee full-render-dispatch.json

      - name: Upload rebalance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-full-plan-rebalance-${{ github.run_id }}
          path: |
            projects/${{ env.PROJECT_ID }}/qa/full_film_rebalance.json
            projects/${{ env.PROJECT_ID }}/qa/optional_capture_availability.json
            projects/${{ env.PROJECT_ID }}/qa/full_render_evidence_bundle.json
            projects/${{ env.PROJECT_ID }}/qa/official_legibility_normalization.json
            projects/${{ env.PROJECT_ID }}/qa/bundled_evidence_verification.json
            projects/${{ env.PROJECT_ID }}/qa/proof_approval_continuity.json
            projects/${{ env.PROJECT_ID }}/qa/semantic_visual_audit.json
            projects/${{ env.PROJECT_ID }}/qa/evidence_asset_audit.json
            projects/${{ env.PROJECT_ID }}/assets/audio/final_mix.metadata.json
            projects/${{ env.PROJECT_ID }}/research/primary_evidence_manifest.json
            full-render-dispatch.json
          if-no-files-found: warn
          retention-days: 30
