name: ORVYQ Runtime Status

on:
  pull_request:
    paths:
      - .github/orvyq-runtime-status.txt
      - .github/workflows/orvyq-runtime-status.yml

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Locate longest uninterrupted proof evidence run
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/contents/projects/001-the-ai-race-no-one-can-afford-to-win/direction/production_plan.json?ref=agent%2Forvyq-system-wide-production" \
            --jq '.content' | base64 -d > production_plan.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync('production_plan.json', 'utf8'));
          const proofEnd = 5361;
          const shots = plan.shots.filter((shot) => shot.start_frame < proofEnd && shot.end_frame <= proofEnd);
          const runs = [];
          let current = [];
          const flush = () => {
            if (!current.length) return;
            const start = current[0].start_frame;
            const end = current.at(-1).end_frame;
            runs.push({
              seconds: (end - start) / plan.fps,
              start_frame: start,
              end_frame: end,
              shots: current.map((shot) => ({
                shot_id: shot.shot_id,
                scene_id: shot.scene_id,
                claim_id: shot.claim_id,
                kind: shot.evidence?.kind,
                start_frame: shot.start_frame,
                end_frame: shot.end_frame,
                duration_seconds: (shot.end_frame - shot.start_frame) / plan.fps,
              })),
            });
            current = [];
          };
          for (const shot of shots) {
            if (shot.asset_type === 'evidence') current.push(shot);
            else flush();
          }
          flush();
          runs.sort((a, b) => b.seconds - a.seconds);
          console.log('EVIDENCE_RUN_RESULT=' + JSON.stringify(runs[0]));
          NODE
