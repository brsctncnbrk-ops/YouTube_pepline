name: ORVYQ Pre-render Diagnostics

on:
  pull_request:
    branches:
      - "claude/factforge-system-design-0pr3v3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: 001-the-ai-race-no-one-can-afford-to-win
      ORVYQ_PREVIEW_FRAMES: "3600"
      ORVYQ_AUDIO_LIMIT_SECONDS: "120"
      ORVYQ_NARRATION_LIMIT_SECONDS: "114.2"
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS assets
        run: git lfs pull

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install root and speech dependencies
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check faster-whisper==1.2.0

      - name: Build audio mix and capture diagnostics
        run: |
          set +e
          node scripts/orvyq_audio_mix.mjs > audio-debug.log 2>&1
          status=$?
          echo "$status" > audio-status.txt
          cat audio-debug.log
          exit 0

      - name: Upload audio diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-audio-debug-${{ github.run_id }}
          path: |
            audio-debug.log
            audio-status.txt
          if-no-files-found: error
          retention-days: 7

      - name: Stop when audio generation failed
        run: test "$(cat audio-status.txt)" = "0"

      - name: Verify narration before captions
        run: python scripts/orvyq_speech_qa.py --project-id "$PROJECT_ID" --max-seconds 120

      - name: Build captions
        run: node scripts/orvyq_caption_build.mjs

      - name: Build curated preview edit plan
        run: node scripts/orvyq_preview_plan.mjs

      - name: Derive Remotion configs
        run: node scripts/remotion_build.mjs derive-configs --project-id "$PROJECT_ID"

      - name: Build Remotion project
        run: node scripts/remotion_build.mjs build-project --project-id "$PROJECT_ID"

      - name: Run editorial QA
        run: node scripts/orvyq_edit_plan_tests.mjs

      - name: Run license audit
        run: node scripts/orvyq_license_audit.mjs

      - name: Run render-ready validation
        run: node scripts/validate.mjs render-ready --project-id "$PROJECT_ID"

      - name: Install Remotion dependencies
        run: |
          cd "projects/$PROJECT_ID/remotion/render_ready_project"
          npm ci --no-audit --no-fund

      - name: Type-check Remotion project
        run: |
          cd "projects/$PROJECT_ID/remotion/render_ready_project"
          npx tsc --noEmit
