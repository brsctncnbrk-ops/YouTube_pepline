name: ORVYQ Full Plan Rebalance Status

on:
  push:
    branches:
      - agent/orvyq-system-wide-production
    paths:
      - .github/orvyq-full-plan-rebalance-status-trigger.txt

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Capture latest rebalance status
        run: |
          set -euo pipefail
          RUNS="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/workflows/orvyq-full-plan-rebalance.yml/runs?branch=agent%2Forvyq-system-wide-production&per_page=5")"
          RUN_ID="$(jq -r '.workflow_runs[0].id // empty' <<<"$RUNS")"
          test -n "$RUN_ID"
          JOBS="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"
          jq -n --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson runs "$RUNS" --argjson jobs "$JOBS" '{generated_at:$generated_at,latest_run:($runs.workflow_runs[0]|{id,status,conclusion,head_sha,created_at,updated_at,html_url}),jobs:[$jobs.jobs[]|{id,name,status,conclusion,started_at,completed_at,steps:[.steps[]|{name,status,conclusion,number}]}]}' > .github/orvyq-full-plan-rebalance-latest.json
          : > .github/orvyq-full-plan-rebalance-failure.txt
          STATUS="$(jq -r '.workflow_runs[0].status' <<<"$RUNS")"
          CONCLUSION="$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$RUNS")"
          if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" != "success" ]; then
            gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/logs" > rebalance-logs.zip
            mkdir -p rebalance-logs
            unzip -q rebalance-logs.zip -d rebalance-logs
            TARGET="$(find rebalance-logs -type f \( -name '*Build approved full edit and run all gates.txt' -o -name '*Preserve existing proof approval by prefix continuity.txt' -o -name '*Rebalance only the post-proof canonical timeline.txt' \) | sort | tail -n 1)"
            if [ -n "$TARGET" ]; then
              cat "$TARGET" > .github/orvyq-full-plan-rebalance-failure.txt
            else
              grep -RInE '"ok"[[:space:]]*:[[:space:]]*false|"valid"[[:space:]]*:[[:space:]]*false|"message"|"issues"|##\[error\]|Process completed with exit code' rebalance-logs > .github/orvyq-full-plan-rebalance-failure.txt || true
            fi
          fi
          cat .github/orvyq-full-plan-rebalance-latest.json
          cat .github/orvyq-full-plan-rebalance-failure.txt
      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/orvyq-full-plan-rebalance-latest.json .github/orvyq-full-plan-rebalance-failure.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Update ORVYQ full-plan rebalance status'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
