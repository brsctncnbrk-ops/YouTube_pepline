name: ORVYQ Source Snapshot

on:
  push:
    branches:
      - agent/orvyq-system-wide-production
    paths:
      - .github/orvyq-source-snapshot-trigger.txt

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source without LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Package tracked source
        run: |
          set -euo pipefail
          git ls-files -z | tar --null -T - -czf orvyq-source.tar.gz

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-source-${{ github.sha }}
          path: orvyq-source.tar.gz
          if-no-files-found: error
          retention-days: 1
