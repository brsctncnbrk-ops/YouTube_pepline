name: ORVYQ Review Copy

on:
  pull_request:
    branches:
      - "claude/factforge-system-design-0pr3v3"

permissions:
  actions: read
  contents: read

jobs:
  review-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download successful final-render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh run download 29517342906 \
            --repo brsctncnbrk-ops/YouTube_pepline \
            --name factforge-render-001-the-ai-race-no-one-can-afford-to-win-29517342906 \
            --dir source
          find source -type f -maxdepth 8 -print

      - name: Create fast review package
        run: |
          set -euo pipefail
          INPUT="$(find source -type f -name 'final_video.mp4' -print -quit)"
          test -n "$INPUT"
          mkdir -p review
          ffmpeg -hide_banner -y -i "$INPUT" \
            -vf "fps=12,scale=-2:480" \
            -c:v libx264 -preset ultrafast -b:v 900k -maxrate 1100k -bufsize 1800k \
            -pix_fmt yuv420p \
            -c:a aac -b:a 96k \
            -movflags +faststart \
            review/orvyq_review_480p.mp4
          for START in 0 180 360 540; do
            ffmpeg -hide_banner -y -ss "$START" -t 180 -i "$INPUT" \
              -vf "fps=1/5,scale=240:-1,tile=6x6" \
              -frames:v 1 "review/contact_sheet_${START}.jpg"
          done
          ffprobe -v error -show_format -show_streams -of json "$INPUT" > review/source_probe.json
          sha256sum "$INPUT" > review/source_sha256.txt
          ls -lh review

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-review-copy-${{ github.run_id }}
          path: review/
          if-no-files-found: error
          retention-days: 3
