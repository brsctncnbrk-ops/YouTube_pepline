name: ORVYQ Canonical Proof

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project id under projects/"
        required: true
        type: string
  push:
    branches:
      - agent/orvyq-system-wide-production
    paths:
      - .github/orvyq-proof-trigger.txt

permissions:
  contents: write

concurrency:
  group: orvyq-proof-${{ inputs.project_id || '001-the-ai-race-no-one-can-afford-to-win' }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ inputs.project_id || '001-the-ai-race-no-one-can-afford-to-win' }}
      ORVYQ_REQUIRE_APPROVED_MUSIC: "1"
      ORVYQ_EDITORIAL_PAUSES: "1"
    steps:
      - name: Checkout exact source with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Lock exact source commit
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$GITHUB_SHA"
          printf '%s\n' "$ACTUAL_SHA" | tee proof-source-sha.txt

      - name: Pull LFS assets
        run: git lfs pull

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install media, PDF and speech tooling
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils
          python -m pip install --disable-pip-version-check faster-whisper==1.2.0 requests==2.32.5

      - name: Resolve and verify canonical narration timeline
        run: |
          set -euo pipefail
          python scripts/orvyq_narration_timeline.py --project-id "$PROJECT_ID"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const dir = `projects/${process.env.PROJECT_ID}`;
          const plan = JSON.parse(fs.readFileSync(`${dir}/direction/production_plan.json`, 'utf8'));
          const timelineRaw = fs.readFileSync(`${dir}/direction/narration_timeline.json`, 'utf8');
          const timeline = JSON.parse(timelineRaw);
          const actual = crypto.createHash('sha256').update(timelineRaw).digest('hex');
          const expected = plan.quality_policy?.narration_timeline_sha256;
          if (!expected || actual !== expected) throw new Error(`Narration timeline drift: ${actual} != ${expected || 'missing'}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `ORVYQ_NARRATION_LIMIT_SECONDS=${timeline.proof.source_end_seconds}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `ORVYQ_SEMANTIC_SPEECH_END_SECONDS=${timeline.proof.speech_output_end_seconds}\n`);
          NODE

      - name: Validate canonical full-duration production plan
        run: |
          set -euo pipefail
          node scripts/orvyq_production_plan.mjs validate --project-id "$PROJECT_ID" --skip-assets
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {productionPlanSha256} from './scripts/lib/orvyq-production.mjs';
          const plan = JSON.parse(fs.readFileSync(`projects/${process.env.PROJECT_ID}/direction/production_plan.json`, 'utf8'));
          const minimumProofSeconds = plan.proof.duration_frames / plan.fps;
          fs.appendFileSync(process.env.GITHUB_ENV, `ORVYQ_MINIMUM_PROOF_SECONDS=${minimumProofSeconds}\n`);
          fs.writeFileSync('production-plan-sha256.txt', `${productionPlanSha256(plan)}\n`);
          NODE

      - name: Fetch and verify official primary evidence
        run: |
          set -euo pipefail
          node scripts/orvyq_fetch_primary_evidence.mjs
          node scripts/orvyq_production_plan.mjs validate --project-id "$PROJECT_ID"

      - name: Fetch licensed music and build semantic proof audio
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {fetchProofMusic} from './scripts/orvyq_fetch_proof_music.mjs';
          import {buildOrvyqAudioMix} from './scripts/orvyq_audio_mix.mjs';
          import {resolveDynamicProofWindow} from './scripts/orvyq_dynamic_proof.mjs';
          await fetchProofMusic(process.env.PROJECT_ID);
          const {result: plannedProof} = await resolveDynamicProofWindow(process.env.PROJECT_ID, {requireAssets: true, requireAudio: false});
          process.env.ORVYQ_AUDIO_LIMIT_SECONDS = String(plannedProof.duration_seconds);
          const finalMix = await buildOrvyqAudioMix(process.env.PROJECT_ID);
          const {result: proof} = await resolveDynamicProofWindow(process.env.PROJECT_ID, {requireAssets: true, requireAudio: true});
          fs.appendFileSync(process.env.GITHUB_ENV, `ORVYQ_PREVIEW_FRAMES=${proof.duration_frames}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `ORVYQ_AUDIO_LIMIT_SECONDS=${proof.duration_seconds}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `ORVYQ_PROOF_SECONDS=${proof.duration_seconds}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `ORVYQ_PROOF_LAST_FRAME=${proof.last_frame}\n`);
          console.log(JSON.stringify({ok: true, final_mix: finalMix, effective_proof: proof}));
          NODE

      - name: Verify narration, build captions and compile exact semantic proof prefix
        run: |
          set -euo pipefail
          python scripts/orvyq_speech_qa.py --project-id "$PROJECT_ID" --max-seconds "$ORVYQ_PROOF_SECONDS"
          node --input-type=module <<'NODE'
          import {buildOrvyqCaptions} from './scripts/orvyq_caption_build.mjs';
          await buildOrvyqCaptions(process.env.PROJECT_ID);
          NODE
          node scripts/orvyq_dynamic_proof.mjs build --project-id "$PROJECT_ID"
          node scripts/orvyq_dynamic_proof_tests.mjs "$PROJECT_ID"

      - name: Run complete compatibility and pre-render audit suite
        run: |
          set -euo pipefail
          node scripts/orvyq_production_plan.mjs validate --project-id "$PROJECT_ID"
          if [ "$PROJECT_ID" = "001-the-ai-race-no-one-can-afford-to-win" ]; then
            npm run orvyq:audits -- "$PROJECT_ID"
          fi

      - name: Upload aggregate pre-render audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-pre-render-audits-${{ env.PROJECT_ID }}-${{ github.run_id }}
          path: |
            projects/${{ env.PROJECT_ID }}/qa/audit_suite.json
            projects/${{ env.PROJECT_ID }}/qa/compatibility_audit.json
            projects/${{ env.PROJECT_ID }}/qa/timeline_audit.json
            projects/${{ env.PROJECT_ID }}/qa/proof_source_speech.json
            projects/${{ env.PROJECT_ID }}/qa/evidence_coverage.json
            projects/${{ env.PROJECT_ID }}/qa/evidence_asset_audit.json
            projects/${{ env.PROJECT_ID }}/qa/semantic_visual_audit.json
            projects/${{ env.PROJECT_ID }}/qa/pacing_audit.json
            projects/${{ env.PROJECT_ID }}/qa/mobile_legibility_audit.json
            projects/${{ env.PROJECT_ID }}/qa/music_cue_audit.json
            projects/${{ env.PROJECT_ID }}/qa/license_audit.json
            projects/${{ env.PROJECT_ID }}/qa/alignment_readiness.json
          if-no-files-found: warn
          retention-days: 30

      - name: Build render-ready project
        run: |
          set -euo pipefail
          node scripts/remotion_build.mjs derive-configs --project-id "$PROJECT_ID"
          node scripts/remotion_build.mjs build-project --project-id "$PROJECT_ID"
          cd "projects/$PROJECT_ID/remotion/render_ready_project"
          npm ci --no-audit --no-fund
          npx tsc --noEmit

      - name: Resolve browser executable
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$BROWSER"
          echo "FACTFORGE_REMOTION_BROWSER_EXECUTABLE=$BROWSER" >> "$GITHUB_ENV"
          "$BROWSER" --version

      - name: Render canonical proof prefix
        run: |
          set -euo pipefail
          APP="projects/$PROJECT_ID/remotion/render_ready_project"
          mkdir -p "$APP/out"
          cd "$APP"
          npx remotion render src/index.ts FactForgeVideo out/orvyq_canonical_proof.mp4 \
            --codec=h264 --frames="0-$ORVYQ_PROOF_LAST_FRAME" --concurrency=1 --image-format=png \
            2>&1 | tee out/proof_render_stdout.txt

      - name: Verify rendered proof media speech and semantic ending
        run: |
          set -euo pipefail
          APP="projects/$PROJECT_ID/remotion/render_ready_project"
          node scripts/orvyq_media_qa.mjs \
            --project-id "$PROJECT_ID" \
            --video "$APP/out/orvyq_canonical_proof.mp4" \
            --report "projects/$PROJECT_ID/qa/orvyq_proof_media_qa.json"
          python scripts/orvyq_speech_qa.py \
            --project-id "$PROJECT_ID" \
            --media "$APP/out/orvyq_canonical_proof.mp4" \
            --max-seconds "$ORVYQ_PROOF_SECONDS" \
            --output-name proof_video_speech_qa.json
          node scripts/orvyq_rendered_proof_ending_audit.mjs "$PROJECT_ID"

      - name: Create review sheets
        run: |
          set -euo pipefail
          APP="projects/$PROJECT_ID/remotion/render_ready_project"
          ffmpeg -hide_banner -loglevel error -y \
            -i "$APP/out/orvyq_canonical_proof.mp4" \
            -vf "fps=1/10,scale=480:-1,tile=5x3" \
            -frames:v 1 "$APP/out/orvyq_proof_contact_sheet.jpg"
          ffprobe -v error -show_format -show_streams -of json \
            "$APP/out/orvyq_canonical_proof.mp4" > "$APP/out/orvyq_proof_probe.json"

      - name: Persist proof review state
        run: |
          set -euo pipefail
          node scripts/manifest_cli.mjs proof-complete \
            --project-id "$PROJECT_ID" \
            --proof-run-id "${{ github.run_id }}" \
            --render-source-sha "${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "projects/$PROJECT_ID/manifest.json"
          git diff --cached --quiet || git commit -m "Record ORVYQ proof run for $PROJECT_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload canonical proof approval package
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-canonical-proof-${{ env.PROJECT_ID }}-${{ github.run_id }}
          path: |
            proof-source-sha.txt
            production-plan-sha256.txt
            projects/${{ env.PROJECT_ID }}/remotion/render_ready_project/out/orvyq_canonical_proof.mp4
            projects/${{ env.PROJECT_ID }}/remotion/render_ready_project/out/orvyq_proof_contact_sheet.jpg
            projects/${{ env.PROJECT_ID }}/remotion/render_ready_project/out/orvyq_proof_probe.json
            projects/${{ env.PROJECT_ID }}/remotion/render_ready_project/out/proof_render_stdout.txt
            projects/${{ env.PROJECT_ID }}/manifest.json
            projects/${{ env.PROJECT_ID }}/direction/production_plan.json
            projects/${{ env.PROJECT_ID }}/direction/narration_timeline.json
            projects/${{ env.PROJECT_ID }}/direction/edit_plan.json
            projects/${{ env.PROJECT_ID }}/qa/effective_proof_window.json
            projects/${{ env.PROJECT_ID }}/qa/production_plan_audit.json
            projects/${{ env.PROJECT_ID }}/qa/audit_suite.json
            projects/${{ env.PROJECT_ID }}/qa/compatibility_audit.json
            projects/${{ env.PROJECT_ID }}/qa/timeline_audit.json
            projects/${{ env.PROJECT_ID }}/qa/proof_ending_audit.json
            projects/${{ env.PROJECT_ID }}/qa/orvyq_proof_media_qa.json
            projects/${{ env.PROJECT_ID }}/qa/proof_video_speech_qa.json
            projects/${{ env.PROJECT_ID }}/assets/audio/final_mix.metadata.json
          if-no-files-found: error
          retention-days: 30
